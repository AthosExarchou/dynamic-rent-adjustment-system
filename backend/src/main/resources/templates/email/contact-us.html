<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .container {
      padding: 20px; background-color: #f9f9f9; border-radius: 10px;
    }
    .header {
      font-size: 20px; font-weight: bold; color: #0d6efd;
    }
    .footer {
      margin-top: 30px; font-size: 12px; color: gray;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">New Contact Form Submission</div>
  <br>
  <p><strong>Name:</strong> <span th:text="${name}">John</span></p>
  <p><strong>Email:</strong> <span th:text="${email}">john@example.com</span></p>
  <p><strong>Subject:</strong> <span th:text="${subject}">Subject</span></p>
  <hr>
  <p><strong>Message:</strong></p>
  <p style="white-space: pre-wrap;" th:text="${message}">Message body</p>
  <div class="footer">Submitted via DRAS Contact Portal</div>
</div>
</body>
</html>
